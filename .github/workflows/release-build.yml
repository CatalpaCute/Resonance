name: Release Build

on:
  push:
    tags:
      - "Testv*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Prepare Android signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done

          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "storePassword=${KEYSTORE_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(grep '^version:' pubspec.yaml | head -n 1 | cut -d ' ' -f 2)"
          if [ -z "$app_version" ]; then
            echo "Failed to read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "value=$app_version" >> "$GITHUB_OUTPUT"

      - name: Read release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ -z "$release_tag" ]; then
            echo "Failed to determine tag name from GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Package Android artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_base="Resonance-android-${{ steps.app_version.outputs.value }}-${{ steps.release_tag.outputs.value }}"

          universal_artifact="${artifact_base}-universal.apk"
          arm64_artifact="${artifact_base}-arm64-v8a.apk"
          armv7_artifact="${artifact_base}-armeabi-v7a.apk"
          x64_artifact="${artifact_base}-x86_64.apk"

          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk "$universal_artifact"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$arm64_artifact"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$armv7_artifact"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$x64_artifact"

          {
            echo "ANDROID_ARTIFACT_UNIVERSAL=$universal_artifact"
            echo "ANDROID_ARTIFACT_ARM64=$arm64_artifact"
            echo "ANDROID_ARTIFACT_ARMV7=$armv7_artifact"
            echo "ANDROID_ARTIFACT_X64=$x64_artifact"
          } >> "$GITHUB_ENV"

      - name: Upload Android universal artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ANDROID_ARTIFACT_UNIVERSAL }}
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: ${{ steps.release_tag.outputs.value }}

      - name: Upload Android arm64 artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ANDROID_ARTIFACT_ARM64 }}
          tag_name: ${{ steps.release_tag.outputs.value }}

      - name: Upload Android armv7 artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ANDROID_ARTIFACT_ARMV7 }}
          tag_name: ${{ steps.release_tag.outputs.value }}

      - name: Upload Android x86_64 artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ANDROID_ARTIFACT_X64 }}
          tag_name: ${{ steps.release_tag.outputs.value }}

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(grep '^version:' pubspec.yaml | head -n 1 | cut -d ' ' -f 2)"
          if [ -z "$app_version" ]; then
            echo "Failed to read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "value=$app_version" >> "$GITHUB_OUTPUT"

      - name: Read release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ -z "$release_tag" ]; then
            echo "Failed to determine tag name from GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux output
        shell: bash
        run: |
          set -euo pipefail
          artifact_base="Resonance-linux-${{ steps.app_version.outputs.value }}-${{ steps.release_tag.outputs.value }}"
          package_dir="$RUNNER_TEMP/$artifact_base"
          package_path="$RUNNER_TEMP/${artifact_base}.zip"

          mkdir -p "$package_dir"
          cp -R build/linux/x64/release/bundle/. "$package_dir/"

          cd "$RUNNER_TEMP"
          zip -r "$package_path" "$artifact_base"
          echo "LINUX_ARTIFACT_NAME=$package_path" >> "$GITHUB_ENV"

      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.LINUX_ARTIFACT_NAME }}
          tag_name: ${{ steps.release_tag.outputs.value }}

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "pubspec.yaml" -Pattern "^version:\s*(.+)$" | Select-Object -First 1
          if (-not $versionLine) {
            throw "Failed to read version from pubspec.yaml"
          }
          $appVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          "value=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read release tag
        id: release_tag
        shell: pwsh
        run: |
          if (-not $env:GITHUB_REF_NAME) {
            throw "Failed to determine tag name from GITHUB_REF_NAME"
          }
          "value=$($env:GITHUB_REF_NAME)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows output
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.value }}"
          $appVersion = "${{ steps.app_version.outputs.value }}"
          $packageName = "Resonance-windows-$appVersion-$tag"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $packageDir -Recurse -Force

          Compress-Archive -Path $packageDir -DestinationPath "$packageName.zip" -Force
          "WINDOWS_ARTIFACT_NAME=$packageName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.WINDOWS_ARTIFACT_NAME }}
          tag_name: ${{ steps.release_tag.outputs.value }}
